name: Release

on:
  push:
    tags: ['*-v*', 'v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    name: Inspect Tag
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.parse.outputs.project }}
      version: ${{ steps.parse.outputs.version }}
      is_app: ${{ steps.parse.outputs.is_app }}
    steps:
      - id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            PROJECT="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"
          else
            PROJECT="oh-save-me"
            VERSION="${TAG#v}"
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$PROJECT" = "oh-save-me" ] || [ "$PROJECT" = "boilerplate" ] || [ "$PROJECT" = "camila" ]; then
            echo "is_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_app=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Tag: $TAG -> Project: $PROJECT, Version: $VERSION"

  web:
    name: Web build
    needs: inspect
    if: needs.inspect.outputs.is_app == 'true'
    runs-on: ubuntu-latest
    env:
      APP: ${{ needs.inspect.outputs.project }}
      VERSION: ${{ needs.inspect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx nx build "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/${{ env.APP }}/browser

  android:
    name: Android APK
    needs: [inspect, web]
    if: needs.inspect.outputs.project == 'oh-save-me'
    runs-on: ubuntu-latest
    env:
      APP: ${{ needs.inspect.outputs.project }}
      VERSION: ${{ needs.inspect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '21' }
      - run: npm ci
      - run: npx nx build "$APP"
      - name: Sync Capacitor
        working-directory: apps/oh-save-me/platforms/mobile
        run: |
          npm install
          npx cap sync android
      - name: Build the APK
        working-directory: apps/oh-save-me/platforms/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      # Renames the file to <app>.<version>.apk and places it next to the other builds.
      - name: Collect into dist/
        run: |
          node tools/builder/collect-artifact.mjs --project "$APP" \
            --from apps/oh-save-me/platforms/mobile/android/app/build/outputs/apk/debug --ext apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/oh-save-me/*.apk

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: [inspect, web]
    if: needs.inspect.outputs.project == 'oh-save-me'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      APP: ${{ needs.inspect.outputs.project }}
      VERSION: ${{ needs.inspect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npx nx build ${{ env.APP }}
      - name: Build with Tauri
        working-directory: apps/oh-save-me
        env:
          CARGO_TARGET_DIR: ../../dist/oh-save-me/desktop
        run: npx tauri build --config platforms/desktop/src-tauri/tauri.conf.json
      - name: Collect into dist/
        shell: bash
        run: |
          node tools/builder/collect-artifact.mjs --project ${{ env.APP }} \
            --from dist/oh-save-me/desktop/release/bundle --ext dmg,msi,exe,deb,rpm,AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/${{ env.APP }}/*.dmg
            dist/${{ env.APP }}/*.msi
            dist/${{ env.APP }}/*.exe
            dist/${{ env.APP }}/*.deb
            dist/${{ env.APP }}/*.rpm
            dist/${{ env.APP }}/*.AppImage
          if-no-files-found: ignore

  publish:
    name: Publish
    needs: [inspect, web, android, desktop]
    if: always() && needs.inspect.outputs.is_app == 'true'
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ needs.inspect.outputs.project }}
      VERSION: ${{ needs.inspect.outputs.version }}
      RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      DRIVE_FOLDER: ${{ vars.DRIVE_FOLDER || 'ibid-builds' }}
    steps:
      - uses: actions/checkout@v4

      - name: Gather the installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '{android,desktop-*}'
      - name: Collect them in one place
        run: |
          mkdir -p dist/${{ env.PROJECT }}
          find artifacts -type f -exec mv -n {} dist/${{ env.PROJECT }}/ \;
          ls -la dist/${{ env.PROJECT }}

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.PROJECT }}/${{ env.PROJECT }}.*
          fail_on_unmatched_files: false

      # --- Google Drive -------------------------------------------------------------------
      # Uploads only installers carrying the version in their name; the web build and the Cargo
      # target are left out. Requires the RCLONE_CONF_BASE64 secret and DRIVE_FOLDER (see README).
      - name: Install rclone
        if: env.RCLONE_CONF_BASE64 != ''
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Upload the installers to Google Drive
        if: env.RCLONE_CONF_BASE64 != ''
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ env.RCLONE_CONF_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf
          rclone copy dist/${{ env.PROJECT }} "gdrive:${{ env.DRIVE_FOLDER }}/${{ env.PROJECT }}/v${{ env.VERSION }}" \
            --include "${{ env.PROJECT }}.*" --progress
          rm -f ~/.config/rclone/rclone.conf

      - name: Warn when Drive is not configured
        if: env.RCLONE_CONF_BASE64 == ''
        run: |
          echo "> **Google Drive is not configured.** The \`RCLONE_CONF_BASE64\` secret is missing; the installers are only on the GitHub release." >> "$GITHUB_STEP_SUMMARY"

      # --- Web ----------------------------------------------------------------------------
      - name: Restore the web build
        uses: actions/download-artifact@v4
        with:
          name: web
          path: dist/${{ env.PROJECT }}/browser

      - name: Publish no Firebase Hosting
        if: startsWith(github.ref, 'refs/tags/') && env.PROJECT == 'oh-save-me' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ibid-32cbe

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release ${{ env.PROJECT }} v${VERSION}"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in dist/${{ env.PROJECT }}/${{ env.PROJECT }}.*; do
              [ -f "$f" ] && echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

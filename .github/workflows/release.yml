name: Release

on:
  push:
    tags: ['*-v*', 'v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example oh-save-me-v1.2.3
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect · Tag and target
    timeout-minutes: 10
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      project: ${{ steps.target.outputs.project }}
      version: ${{ steps.target.outputs.version }}
      is_app: ${{ steps.target.outputs.is_app }}
      has_web: ${{ steps.target.outputs.has_web }}
      has_android: ${{ steps.target.outputs.has_android }}
      has_desktop: ${{ steps.target.outputs.has_desktop }}
      has_drive: ${{ steps.capabilities.outputs.has_drive }}
      has_hosting: ${{ steps.capabilities.outputs.has_hosting }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve what the tag releases
        id: target
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node tools/ci/release-target.mjs >> "$GITHUB_OUTPUT"

      - name: Resolve the configured delivery channels
        id: capabilities
        env:
          RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          {
            echo "has_drive=${{ secrets.RCLONE_CONF_BASE64 != '' }}"
            echo "has_hosting=${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}"
          } >> "$GITHUB_OUTPUT"

  web:
    name: Package · Web bundle
    needs: inspect
    if: needs.inspect.outputs.has_web == 'true'
    timeout-minutes: 30
    runs-on: [self-hosted, macOS, ARM64]
    env:
      APP: ${{ needs.inspect.outputs.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
        with:
          nx-cache-key: release
      - run: npx nx build "$APP"
      - uses: actions/upload-artifact@v6
        with:
          name: web
          path: dist/${{ env.APP }}/browser

  android:
    name: Package · Android APK
    needs: inspect
    if: needs.inspect.outputs.has_android == 'true'
    timeout-minutes: 60
    runs-on: [self-hosted, macOS, ARM64]
    env:
      APP: ${{ needs.inspect.outputs.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
        with:
          nx-cache-key: release
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Install the mobile platform dependencies
        working-directory: apps/${{ env.APP }}/platforms/mobile
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Unlock the release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - run: npx nx mobile-apk "$APP"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Discard the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: dist/${{ env.APP }}/*.apk

  desktop:
    name: Package · Desktop ${{ matrix.platform }}
    needs: inspect
    if: needs.inspect.outputs.has_desktop == 'true'
    timeout-minutes: 90
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: [self-hosted, macOS, ARM64]
    env:
      APP: ${{ needs.inspect.outputs.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
        with:
          nx-cache-key: release-${{ matrix.platform }}
      - uses: dtolnay/rust-toolchain@stable
      - run: npx nx desktop-build "$APP"
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            dist/${{ env.APP }}/*.dmg
            dist/${{ env.APP }}/*.msi
            dist/${{ env.APP }}/*.exe
            dist/${{ env.APP }}/*.deb
            dist/${{ env.APP }}/*.rpm
            dist/${{ env.APP }}/*.AppImage
          if-no-files-found: ignore

  drive:
    name: Deliver · Google Drive
    needs: [inspect, android, desktop]
    if: >-
      !cancelled() && needs.inspect.outputs.has_drive == 'true' &&
      (needs.inspect.outputs.has_android == 'true' || needs.inspect.outputs.has_desktop == 'true')
    timeout-minutes: 30
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      drive_url: ${{ steps.share.outputs.drive_url }}
    env:
      PROJECT: ${{ needs.inspect.outputs.project }}
      VERSION: ${{ needs.inspect.outputs.version }}
      DRIVE_FOLDER: ${{ vars.DRIVE_FOLDER || 'ibid-builds' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: '{android,desktop-*}'
      - name: Gather the installers
        run: node tools/ci/gather-installers.mjs
        env:
          SOURCE_DIR: artifacts
          TARGET_DIR: dist/${{ env.PROJECT }}
      - name: Ensure rclone is installed
        run: |
          if ! command -v rclone &> /dev/null; then
            brew install rclone
          fi
      - name: Upload the installers
        env:
          RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          rclone copy "dist/$PROJECT" "gdrive:$DRIVE_FOLDER/$PROJECT/v$VERSION" --stats-one-line
          rm -f ~/.config/rclone/rclone.conf
      - name: Resolve Google Drive link
        id: share
        env:
          RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          LINK=$(rclone link "gdrive:$DRIVE_FOLDER/$PROJECT" 2>/dev/null || echo "")
          echo "drive_url=$LINK" >> "$GITHUB_OUTPUT"
          rm -f ~/.config/rclone/rclone.conf

  hosting:
    name: Deliver · Firebase Hosting
    needs: [inspect, web]
    if: needs.inspect.outputs.has_web == 'true' && needs.inspect.outputs.has_hosting == 'true'
    timeout-minutes: 20
    runs-on: [self-hosted, macOS, ARM64]
    env:
      PROJECT: ${{ needs.inspect.outputs.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: web
          path: dist/${{ env.PROJECT }}/browser
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ibid-32cbe
          target: ${{ env.PROJECT }}

  storybook:
    name: Deliver · Storybook
    needs: inspect
    if: needs.inspect.outputs.project == 'boilerplate' && needs.inspect.outputs.has_hosting == 'true'
    timeout-minutes: 30
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
        with:
          nx-cache-key: release
      - run: npx nx build-storybook boilerplate
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ibid-32cbe
          target: storybook

  verified:
    name: Release verified
    needs: [inspect, web, android, desktop, drive, hosting, storybook]
    if: always() && needs.inspect.outputs.is_app == 'true'
    timeout-minutes: 10
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5
      - name: Draw the execution graph
        env:
          PIPELINE: release
          JOB_RESULTS: ${{ toJson(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/execution-graph.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when any group did not pass
        env:
          JOB_RESULTS: ${{ toJson(needs) }}
        run: node tools/ci/assert-groups-passed.mjs

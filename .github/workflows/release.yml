name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP: oh-save-me

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - id: v
        run: echo "version=$(node -p "require('./apps/oh-save-me/package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npx nx build $APP
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/oh-save-me/browser

  android:
    name: Android APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '21' }
      - run: npm ci
      - run: npx nx build $APP
      - name: Sync Capacitor
        working-directory: apps/oh-save-me/platforms/mobile
        run: |
          npm install
          npx cap sync android
      - name: Build the APK
        working-directory: apps/oh-save-me/platforms/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      # Renames the file to <app>.<version>.apk and places it next to the other builds.
      - name: Collect into dist/
        run: |
          node tools/builder/collect-artifact.mjs --project $APP \
            --from apps/oh-save-me/platforms/mobile/android/app/build/outputs/apk/debug --ext apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/oh-save-me/*.apk

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npx nx build oh-save-me
      - name: Build with Tauri
        working-directory: apps/oh-save-me
        env:
          CARGO_TARGET_DIR: ../../dist/oh-save-me/desktop
        run: npx tauri build --config platforms/desktop/src-tauri/tauri.conf.json
      - name: Collect into dist/
        shell: bash
        run: |
          node tools/builder/collect-artifact.mjs --project oh-save-me \
            --from dist/oh-save-me/desktop/release/bundle --ext dmg,msi,exe,deb,rpm,AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/oh-save-me/*.dmg
            dist/oh-save-me/*.msi
            dist/oh-save-me/*.exe
            dist/oh-save-me/*.deb
            dist/oh-save-me/*.rpm
            dist/oh-save-me/*.AppImage
          if-no-files-found: ignore

  publish:
    name: Publish
    needs: [web, android, desktop]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.web.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Gather the installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '{android,desktop-*}'
      - name: Collect them in one place
        run: |
          mkdir -p dist/oh-save-me
          find artifacts -type f -exec mv -n {} dist/oh-save-me/ \;
          ls -la dist/oh-save-me

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/oh-save-me/oh-save-me.*
          fail_on_unmatched_files: false

      # --- Google Drive -------------------------------------------------------------------
      # Uploads only installers carrying the version in their name; the web build and the Cargo
      # target are left out. Requires the RCLONE_CONF_BASE64 secret and DRIVE_FOLDER (see README).
      - name: Install rclone
        if: ${{ secrets.RCLONE_CONF_BASE64 != '' }}
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Upload the installers to Google Drive
        if: ${{ secrets.RCLONE_CONF_BASE64 != '' }}
        env:
          DRIVE_FOLDER: ${{ vars.DRIVE_FOLDER || 'Builds' }}
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf
          rclone copy dist/oh-save-me "gdrive:${DRIVE_FOLDER}/oh-save-me/v${VERSION}" \
            --include "oh-save-me.*" --progress
          rm -f ~/.config/rclone/rclone.conf

      - name: Warn when Drive is not configured
        if: ${{ secrets.RCLONE_CONF_BASE64 == '' }}
        run: |
          echo "> **Google Drive is not configured.** The \`RCLONE_CONF_BASE64\` secret is missing; the installers are only on the GitHub release." >> "$GITHUB_STEP_SUMMARY"

      # --- Web ----------------------------------------------------------------------------
      - name: Restore the web build
        uses: actions/download-artifact@v4
        with:
          name: web
          path: dist/oh-save-me/browser

      - name: Publish no Firebase Hosting
        if: ${{ startsWith(github.ref, 'refs/tags/') && secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ibid-32cbe

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release v${VERSION}"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in dist/oh-save-me/oh-save-me.*; do
              [ -f "$f" ] && echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

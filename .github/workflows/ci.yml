name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify · Static, tests and build
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64]
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release)')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Refuse to run against empty submodules
        run: node tools/ci/verify-submodules.mjs

      - uses: ./.github/actions/setup-workspace
        with:
          nx-cache-key: ci

      - uses: nrwl/nx-set-shas@v5
        id: shas

      - name: Decide the scope
        id: scope
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "nx=run-many --all" >> "$GITHUB_OUTPUT"
          else
            echo "nx=affected" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the affected projects
        id: affected
        env:
          NX_BASE: ${{ steps.shas.outputs.base }}
          NX_HEAD: ${{ steps.shas.outputs.head }}
        run: node tools/ci/affected-scope.mjs >> "$GITHUB_OUTPUT"

      - name: Platform declarations match what each app can build
        run: node tools/ci/platforms.mjs

      - name: Lint against the warning ceiling
        run: node tools/ci/lint-budget.mjs

      - name: Types
        env:
          NX_BASE: ${{ steps.shas.outputs.base }}
          NX_HEAD: ${{ steps.shas.outputs.head }}
        run: npx nx ${{ steps.scope.outputs.nx }} -t typecheck --parallel=3

      - name: Unit tests
        env:
          NX_BASE: ${{ steps.shas.outputs.base }}
          NX_HEAD: ${{ steps.shas.outputs.head }}
        run: npx nx ${{ steps.scope.outputs.nx }} -t test --parallel=3

      - name: Build
        env:
          NX_BASE: ${{ steps.shas.outputs.base }}
          NX_HEAD: ${{ steps.shas.outputs.head }}
        run: npx nx ${{ steps.scope.outputs.nx }} -t build --parallel=3
    outputs:
      projects: ${{ steps.affected.outputs.projects }}
      e2e_apps: ${{ steps.affected.outputs.e2e_apps }}
      has_e2e: ${{ steps.affected.outputs.has_e2e }}

  journeys:
    name: Journeys · E2E and accessibility
    needs: verify
    if: needs.verify.outputs.has_e2e == 'true'
    timeout-minutes: 90
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: ./.github/actions/setup-workspace
        with:
          nx-cache-key: ci

      - name: Install the browser
        run: npx playwright install chromium

      - name: Run every affected journey
        env:
          APPS: ${{ needs.verify.outputs.e2e_apps }}
        run: node tools/ci/run-journeys.mjs

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: journeys
          path: |
            apps/*/.playwright-artifacts
            test-results
          if-no-files-found: ignore

  verified:
    name: CI verified
    needs: [verify, journeys]
    if: always()
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Draw the execution graph
        env:
          AFFECTED_PROJECTS: ${{ needs.verify.outputs.projects }}
          JOB_RESULTS: ${{ toJson(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/execution-graph.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when any group did not pass
        env:
          JOB_RESULTS: ${{ toJson(needs) }}
        run: node tools/ci/assert-groups-passed.mjs

  automerge:
    name: Merge · Deploy pull request
    needs: verified
    if: >-
      needs.verified.result == 'success' &&
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'bump/')
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Merge now that every group is green
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "$REPO" --merge --delete-branch

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Sets the comparison base so `nx affected` only runs what the changes touch.
      - uses: nrwl/nx-set-shas@v4

      - name: Lint
        run: npx nx affected -t lint --parallel=3

      - name: Unit tests
        run: npx nx affected -t test --parallel=3

      - name: Build
        run: npx nx affected -t build --parallel=3

      - name: Summary
        if: always()
        run: |
          {
            echo "### Verification"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$(node -p "require('./package.json').version")\` |"
            echo "| Affected projects | \`$(npx nx show projects --affected 2>/dev/null | tr '\n' ' ')\` |"
          } >> "$GITHUB_STEP_SUMMARY"

name: Build RunPod Serverless Workers

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which worker to build and push'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - trellis
          - flux

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Serverless Workers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push TRELLIS Worker
        if: inputs.target == 'all' || inputs.target == 'trellis'
        uses: docker/build-push-action@v6
        with:
          context: tools/runpod
          file: tools/runpod/Dockerfile.trellis
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/papikapi-trellis:latest

      - name: Build & Push FLUX.2 Worker
        if: inputs.target == 'all' || inputs.target == 'flux'
        uses: docker/build-push-action@v6
        with:
          context: tools/runpod
          file: tools/runpod/Dockerfile.flux
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/papikapi-flux:latest

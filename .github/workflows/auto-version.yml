name: Automatic versioning

on:
  push:
    branches: [main]

concurrency:
  group: auto-version
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Compute and tag the version
    runs-on: ubuntu-latest
    # Avoids reacting to the release commit this workflow creates.
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute independent versions and changelogs with Nx
        id: release
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          npx nx release --yes --skip-publish
          git push --follow-tags origin main

      - name: Summary
        run: |
          {
            echo "### Independent Nx Release Complete"
            echo ""
            echo "Independent versioning and changelogs generated and pushed to origin."
            if [ -z "${{ secrets.RELEASE_TOKEN }}" ]; then
              echo ""
              echo "> **RELEASE_TOKEN is not set.** The tag was pushed with GITHUB_TOKEN,"
              echo "> which does not start other workflows, so **release.yml did not run**. Add a personal"
              echo "> token with \`contents:write\` as the \`RELEASE_TOKEN\` secret, or trigger the release manually."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: Automatic versioning

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  version:
    name: Version · Tag every changed project
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release)')
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Skip when main has already moved on
        id: guard
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT="$(git rev-parse HEAD)"
          if [ "$CURRENT" != "$VERIFIED_SHA" ]; then
            echo "main is at $CURRENT, but CI verified $VERIFIED_SHA; the newer commit will version itself."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-workspace
        if: steps.guard.outputs.proceed == 'true'
        with:
          nx-cache-key: version

      - name: Git identity
        if: steps.guard.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute the independent versions and changelogs
        if: steps.guard.outputs.proceed == 'true'
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          BEFORE="$(git tag --list)"
          npx nx release --skip-publish
          git push --follow-tags origin main
          comm -13 <(echo "$BEFORE" | sort) <(git tag --list | sort) > created-tags.txt
          cat created-tags.txt

      - name: Summary
        if: always() && steps.guard.outputs.proceed == 'true'
        env:
          RELEASE_TOKEN_SET: ${{ secrets.RELEASE_TOKEN != '' }}
        run: node tools/ci/version-summary.mjs >> "$GITHUB_STEP_SUMMARY"

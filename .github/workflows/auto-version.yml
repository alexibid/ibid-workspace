name: Automatic versioning

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  version:
    name: Version · Tag every changed project
    timeout-minutes: 30
    runs-on: [self-hosted, macOS, ARM64]
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release)')
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Skip when main has already moved on
        id: guard
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT="$(git rev-parse HEAD)"
          if [ "$CURRENT" != "$VERIFIED_SHA" ]; then
            echo "main is at $CURRENT, but CI verified $VERIFIED_SHA; the newer commit will version itself."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to run against empty submodules
        if: steps.guard.outputs.proceed == 'true'
        run: node tools/ci/verify-submodules.mjs

      - uses: ./.github/actions/setup-workspace
        if: steps.guard.outputs.proceed == 'true'
        with:
          nx-cache-key: version

      - name: Version every changed project and publish it
        if: steps.guard.outputs.proceed == 'true'
        env:
          HUSKY: 0
          NPM_CONFIG_LOGLEVEL: error
        run: node tools/ci/release.mjs

      - name: Summary
        if: always() && steps.guard.outputs.proceed == 'true'
        env:
          RELEASE_TOKEN_SET: ${{ secrets.RELEASE_TOKEN != '' }}
        run: node tools/ci/version-summary.mjs >> "$GITHUB_STEP_SUMMARY"

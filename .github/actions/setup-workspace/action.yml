name: Setup workspace
description: Installs Node 24 and the workspace dependencies on an already checked out repository.

inputs:
  nx-cache-key:
    description: Namespace that keeps the Nx cache of one pipeline apart from another.
    required: false
    default: shared

runs:
  using: composite
  steps:
    # package-manager-cache defaults to true and turns itself on because package.json
    # declares packageManager, so dropping the cache input is not enough. The runner is a
    # machine we own: ~/.npm and the Nx cache survive between runs on their own, and saving
    # them through the Actions cache service uploads 1.3 GB per job for nothing.
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        package-manager-cache: false

    - name: Install dependencies
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund --loglevel=error

    - name: Keep the Nx cache outside the workspace
      shell: bash
      run: echo "NX_CACHE_DIRECTORY=$HOME/.cache/nx-${{ inputs.nx-cache-key }}" >> "$GITHUB_ENV"

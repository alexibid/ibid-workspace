name: Setup workspace
description: Installs Node 24, the workspace dependencies and the Nx cache on an already checked out repository.

inputs:
  nx-cache-key:
    description: Namespace that keeps the Nx cache of one pipeline apart from another.
    required: false
    default: shared

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund --loglevel=error

    - name: Restore the Nx cache
      uses: actions/cache@v5
      with:
        path: |
          .nx/cache
          .nx/workspace-data
        key: nx-${{ runner.os }}-${{ inputs.nx-cache-key }}-${{ github.sha }}
        restore-keys: |
          nx-${{ runner.os }}-${{ inputs.nx-cache-key }}-
          nx-${{ runner.os }}-

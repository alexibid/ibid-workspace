name: Setup workspace
description: Installs Node 24 and the workspace dependencies on an already checked out repository.

inputs:
  nx-cache-key:
    description: Namespace that keeps the Nx cache of one pipeline apart from another.
    required: false
    default: shared

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24

    # The runner is a machine we own, so ~/.npm and the Nx cache survive between runs on
    # their own. Restoring either through the Actions cache service would trade a local
    # read for a network round trip, which measured twelve times slower.
    - name: Install dependencies
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund --loglevel=error

    - name: Keep the Nx cache outside the workspace
      shell: bash
      run: echo "NX_CACHE_DIRECTORY=$HOME/.cache/nx-${{ inputs.nx-cache-key }}" >> "$GITHUB_ENV"

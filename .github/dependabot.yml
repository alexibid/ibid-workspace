version: 2

# The apps and libs are private submodules. Dependabot only reads them with a token kept as
# a Dependabot secret; the Actions secret of the same name never reaches Dependabot.
registries:
  github-submodules:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.RELEASE_TOKEN}}

# No pull requests: the Dependency refresh workflow updates the lockfile within each range and
# pushes it to main once CI's checks pass. Dependabot only keeps the alerts.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    registries:
      - github-submodules
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "@faker-js/faker"
      - dependency-name: "csv-parse"
      - dependency-name: "minimatch"
      - dependency-name: "uuid"

  - package-ecosystem: "cargo"
    directory: "/tools/workspace-menu/platforms/desktop/src-tauri"
    registries:
      - github-submodules
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "glib"

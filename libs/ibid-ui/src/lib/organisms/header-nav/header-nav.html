<div
  class="o-header-nav"
  [class.o-header-nav--open]="open()"
  [class.o-header-nav--overlay]="mode() === 'overlay'"
  [style.--header-nav-width]="drawerWidth()"
>
  @if (open() && showScrim()) {
    <ibid-scrim
      class="o-header-nav__scrim"
      [dismissLabel]="closeLabel()"
      (dismissed)="closeRequested.emit()"
    ></ibid-scrim>
  }
  <aside class="o-header-nav__panel">
    <ng-content></ng-content>
  </aside>
</div>

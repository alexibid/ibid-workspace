@if (!hasEnoughData()) {
  <app-empty-state [message]="'ainda sem dados suficientes'" />
} @else {
  <div class="o-chart" [class.o-chart--mini]="size() === 'mini'">
    @if (size() === 'default') {
      <app-chart-headline [caption]="headlineCaption()" [value]="seriesStats()!.last.value" [context]="context()" />
      <div class="o-chart__divider"></div>
    }

    <!-- role="img" wraps only the plot: it must not contain focusable content, and the
         headline above carries an interactive explanation affordance. -->
    <div
      class="o-chart__surface"
      [attr.role]="size() === 'default' ? 'img' : null"
      [attr.aria-label]="size() === 'default' ? ariaSummary() : null"
    >
      <svg [attr.viewBox]="viewBox()" preserveAspectRatio="none" class="o-chart__svg">
        <defs>
          <linearGradient id="chart-area-gradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" [attr.stop-color]="primarySeries()?.color" stop-opacity="0.25" />
            <stop offset="100%" [attr.stop-color]="primarySeries()?.color" stop-opacity="0" />
          </linearGradient>
        </defs>

        
        @if (size() !== 'mini') {
          @for (tick of yAxisTicks(); track tick.y) {
            <line 
              [attr.x1]="0" 
              [attr.x2]="plotWidth()" 
              [attr.y1]="tick.y" 
              [attr.y2]="tick.y" 
              class="o-chart__grid-line"
              stroke-width="1" 
              stroke-dasharray="3 3"
            />
            <text 
              [attr.x]="plotWidth() - 4" 
              [attr.y]="tick.y - 4" 
              text-anchor="end"
              class="o-chart__y-axis-label"
            >
              {{ tick.value.toFixed(0) }}€
            </text>
          }

          
          @for (tick of xAxisTicks(); track tick.x) {
            <text 
              [attr.x]="tick.x" 
              [attr.y]="172" 
              text-anchor="end"
              alignment-baseline="middle"
              [attr.transform]="'rotate(-90 ' + tick.x + ' 172)'"
              class="o-chart__marker-label"
            >
              {{ tick.label }}
            </text>
          }
        }

        @if (size() === 'mini') {
          
          <path [attr.d]="pathFor(plottedSeries()[0].points)" [attr.stroke]="primarySeries()!.color" fill="none" class="o-chart__path" [style.stroke-width]="pathStrokeWidth()" />
        } @else {
          
          @for (entry of plottedSeries(); track entry.series.name) {
            @if (entry.series.type === 'line') {
              @if (entry.series.fillArea) {
                <path [attr.d]="areaPathFor(entry.points)" [attr.fill]="entry.series.color" class="o-chart__area-fill" />
              }
              <path [attr.d]="pathFor(entry.points)" [attr.stroke]="entry.series.color" fill="none" class="o-chart__path" [style.stroke-width]="pathStrokeWidth()" />
            } @else {
              @for (point of entry.points; track point.point.label) {
                <rect 
                  [attr.x]="point.x" 
                  [attr.y]="point.y" 
                  [attr.width]="point.width" 
                  [attr.height]="point.height" 
                  [attr.fill]="entry.series.color" 
                  class="o-chart__bar" 
                />
              }
            }
          }

          
          @for (marker of markers(); track marker.role + marker.seriesName + marker.x) {
            @if (marker.role === 'default') {
              @if (marker.isBar) {
                
                <rect
                  #origin="cdkOverlayOrigin"
                  cdkOverlayOrigin
                  [attr.x]="marker.x!"
                  [attr.y]="marker.y!"
                  [attr.width]="marker.width!"
                  [attr.height]="marker.height!"
                  class="o-chart__marker-hit-area-rect"
                  role="button"
                  [attr.aria-label]="marker.point.label + ': ' + marker.point.value"
                  (click)="openTooltip(marker, origin)"
                />
              } @else {
                
                <circle 
                  #origin="cdkOverlayOrigin"
                  cdkOverlayOrigin
                  [attr.cx]="marker.x" 
                  [attr.cy]="marker.y" 
                  r="16" 
                  class="o-chart__marker-hit-area"
                  role="button"
                  [attr.aria-label]="marker.point.label + ': ' + marker.point.value"
                  (click)="openTooltip(marker, origin)" 
                />
              }
            } @else {
              
              <g
                #origin="cdkOverlayOrigin"
                cdkOverlayOrigin
                class="o-chart__marker-hit"
                role="button"
                [attr.aria-label]="marker.point.label + ': ' + marker.point.value"
                (click)="openTooltip(marker, origin)"
              >
                <circle [attr.cx]="marker.x" [attr.cy]="marker.y" r="22" class="o-chart__marker-hit-area" />
                <circle
                  [attr.cx]="marker.x"
                  [attr.cy]="marker.y"
                  r="4"
                  class="o-chart__marker"
                  [style.color]="marker.color"
                  [class.o-chart__marker--first]="marker.role === 'first'"
                  [class.o-chart__marker--max]="marker.role === 'max'"
                  [class.o-chart__marker--min]="marker.role === 'min'"
                  [class.o-chart__marker--last]="marker.role === 'last'"
                />
                @if (marker.role === 'first' || marker.role === 'last') {
                  <text
                    [attr.x]="marker.role === 'first' ? marker.x : marker.x - 6"
                    [attr.y]="marker.role === 'first' ? marker.y! - 14 : marker.y! + 18"
                    [attr.text-anchor]="marker.role === 'first' ? 'start' : 'end'"
                    class="o-chart__marker-label"
                  >
                    {{ markerLabelFor(marker) }}
                  </text>
                }
              </g>
            }
          }
        }
      </svg>
    </div>

    @if (size() === 'default') {
      <app-chart-legend [entries]="legendEntries()" />
    }
  </div>

  @if (activeMarker(); as active) {
    <app-chart-tooltip
      [origin]="activeOrigin()!"
      [isOpen]="true"
      [title]="active.point.label"
      [label]="active.seriesName"
      [value]="active.point.displayValue ?? (active.point.value + '')"
      (closed)="closeTooltip()"
    />
  }
}

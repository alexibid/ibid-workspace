<div class="m-data-table">
  <table class="o-table m-data-table__grid">
    @if (caption()) {
      <caption class="m-data-table__caption">{{ caption() }}</caption>
    }

    <thead>
      <tr>
        @for (column of columns(); track column.label()) {
          <th
            scope="col"
            class="m-data-table__heading"
            [class.m-data-table__heading--end]="column.align() === 'end'"
          >
            {{ column.label() }}
          </th>
        }
      </tr>
    </thead>

    <tbody>
      @for (row of rows(); track $index) {
        <tr class="m-data-table__row">
          @for (column of columns(); track column.label()) {
            <td
              class="m-data-table__cell"
              [class.m-data-table__cell--end]="column.align() === 'end'"
            >
              <ng-container
                *ngTemplateOutlet="column.template; context: { $implicit: row }"
              ></ng-container>
            </td>
          }
        </tr>
      } @empty {
        <tr>
          <td class="m-data-table__empty" [attr.colspan]="columns().length">
            {{ emptyMessage() }}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

<button
  #trigger="cdkOverlayOrigin"
  cdkOverlayOrigin
  type="button"
  class="m-info-balloon__trigger"
  (click)="toggle()"
  [attr.aria-label]="title()"
  [attr.aria-expanded]="isOpen()"
>
  <ibid-icon [name]="iconName()" iconClass="m-info-balloon__icon"></ibid-icon>
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="close()"
  (overlayOutsideClick)="close()"
>
  <div class="m-info-balloon__panel" role="dialog" [attr.aria-label]="title()">
    <div class="m-info-balloon__header">
      <span class="m-info-balloon__title">{{ title() }}</span>
      <button type="button" class="m-info-balloon__close" (click)="close()" [attr.aria-label]="closeLabel()">
        <ibid-icon name="close-line" iconClass="m-info-balloon__icon"></ibid-icon>
      </button>
    </div>

    <p class="m-info-balloon__body">{{ message() }}</p>
  </div>
</ng-template>

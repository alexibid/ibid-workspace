@if (showHandle) {
  <div class="m-bottom-sheet-dialog__handle"></div>
}

@if (showHeader) {
  <header class="m-bottom-sheet-dialog__header">
    @if (iconName) {
      <ibid-icon class="m-bottom-sheet-dialog__icon" [name]="iconName"></ibid-icon>
    }
    <h2 class="m-bottom-sheet-dialog__title"><ng-content select="[sheet-title]"></ng-content></h2>
    <div class="m-bottom-sheet-dialog__actions">
      <ng-content select="[sheet-actions]"></ng-content>
      @if (showClose) {
        <ibid-icon-button class="m-bottom-sheet-dialog__close-btn" ariaLabel="Fechar" (clicked)="closeClicked.emit()">
          <ibid-icon name="chevron-down"></ibid-icon>
        </ibid-icon-button>
      }
    </div>
  </header>
}

<div class="m-bottom-sheet-dialog__body">
  <ng-content></ng-content>
</div>

@if (showFooter) {
  <footer class="m-bottom-sheet-dialog__footer">
    <ng-content select="[sheet-footer]"></ng-content>
  </footer>
}

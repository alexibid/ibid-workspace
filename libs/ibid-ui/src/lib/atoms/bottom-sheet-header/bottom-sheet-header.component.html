<header class="a-bottom-sheet-header">
  @if (iconName) {
    <ibid-icon class="a-bottom-sheet-header__icon" [name]="iconName"></ibid-icon>
  }
  <h2 class="a-bottom-sheet-header__title"><ng-content></ng-content></h2>
  @if (showClose) {
    <button
      type="button"
      class="a-button a-button--icon a-bottom-sheet-header__close-btn m-bottom-sheet-dialog__close-btn"
      (click)="closeClicked.emit()"
    >
      <ibid-icon name="close-line"></ibid-icon>
    </button>
  }
</header>

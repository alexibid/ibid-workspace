<ibid-icon-button
  class="a-fab"
  ariaLabel="Show assistant suggestions"
  (clicked)="clicked.emit()"
>
  <ibid-icon name="sparkle"></ibid-icon>
  @if (badgeCount() > 0) {
    <span class="a-assistant-fab__badge" [attr.aria-label]="badgeCount() + ' tarefas pendentes'">
      {{ badgeCount() }}
    </span>
  }
</ibid-icon-button>

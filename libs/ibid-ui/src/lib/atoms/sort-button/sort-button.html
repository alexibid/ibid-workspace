<button
  type="button"
  class="a-sort-button"
  [class.a-sort-button--active]="active"
  (click)="onClick()"
>
  <span class="a-sort-button__label">{{ label }}</span>
  <ibid-icon
    name="chevron-down"
    class="a-sort-button__icon"
    [class.a-sort-button__icon--active]="active"
    [class.a-sort-button__icon--asc]="active && direction === 'asc'"
  ></ibid-icon>
</button>

<button
  type="button"
  class="a-icon-toggle"
  [class.a-icon-toggle--active]="checked"
  [class.a-icon-toggle--disabled]="disabled"
  [disabled]="disabled"
  role="switch"
  [attr.aria-checked]="checked"
  [attr.aria-label]="ariaLabel || label"
  (click)="toggle()"
>
  <span class="a-icon-toggle__track">
    <span class="a-icon-toggle__thumb">
      @if (icon) {
        <ibid-icon [name]="icon" class="a-icon-toggle__icon"></ibid-icon>
      }
    </span>
  </span>
  @if (label) {
    <span class="a-icon-toggle__label">{{ label }}</span>
  }
</button>

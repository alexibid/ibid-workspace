<ibid-header [expanded]="navOpen()">
  <span headerBrand class="boilerplate-brand">
    <ibid-icon class="boilerplate-brand__mark" name="ibid"></ibid-icon>
    <span class="boilerplate-brand__label">{{ i18n.translate('title') }}</span>
  </span>

  <ibid-icon-button
    headerActions
    [ariaLabel]="i18n.translate('navToggleLabel')"
    (clicked)="toggleNav()"
  >
    ≡
  </ibid-icon-button>
</ibid-header>

<ibid-header-nav
  [open]="navOpen()"
  mode="overlay"
  [showScrim]="true"
  [closeLabel]="i18n.translate('navCloseLabel')"
  (closeRequested)="closeNav()"
>
  <ibid-nav-menu class="boilerplate-nav" [items]="navItems" (itemSelected)="closeNav()">
    <p navFooter class="boilerplate-nav__footer">ibid design system</p>
  </ibid-nav-menu>
</ibid-header-nav>

<main class="boilerplate-page">
  <router-outlet></router-outlet>
</main>

<section class="showcase__section">
  <h2>Structure</h2>
  <ibid-card>
    <h3>Card</h3>
    <ibid-summary-row label="Groceries">220 €</ibid-summary-row>
    <ibid-divider />
    <ibid-summary-row label="Transport">86 €</ibid-summary-row>
    <ibid-progress-row label="Budget used" [value]="220" [percentage]="72" color="#2c6a4d" />
  </ibid-card>
</section>

<section class="showcase__section">
  <h2>Indicators</h2>
  <div class="showcase__row">
    <ibid-stat-icon icon="add" theme="success" />
    <ibid-stat-icon icon="add" theme="danger" />
    <ibid-legend-item label="Essentials" color="#2c6a4d" />
    <ibid-legend-item label="Lifestyle" color="#8a5712" />
    <ibid-stack-dots [count]="4" [activeIndex]="1" />
  </div>
</section>

<section class="showcase__section">
  <h2>Empty state</h2>
  <ibid-empty-state message="Nothing here yet" />
</section>

<section class="showcase__section">
  <h2>Surface variants</h2>
  <div class="showcase__grid">
    <ibid-card customClass="u-bg-teal"><h3>Teal</h3><p>u-bg-teal</p></ibid-card>
    <ibid-card customClass="u-bg-amber"><h3>Amber</h3><p>u-bg-amber</p></ibid-card>
    <ibid-card customClass="u-bg-coral"><h3>Coral</h3><p>u-bg-coral</p></ibid-card>
    <ibid-card customClass="u-bg-pink"><h3>Pink</h3><p>u-bg-pink</p></ibid-card>
  </div>
</section>

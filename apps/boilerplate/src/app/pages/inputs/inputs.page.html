<section class="showcase__section">
  <h2>Inputs</h2>
  <div class="showcase__grid">
    <ibid-form-field label="Search">
      <ibid-search-input [value]="searchTerm()" (valueChange)="searchTerm.set($event)" />
    </ibid-form-field>

    <ibid-form-field label="Quantity">
      <ibid-number-input [value]="quantity()" (valueChange)="quantity.set($event)" />
    </ibid-form-field>

    <ibid-form-field label="Period">
      <ibid-select
        [value]="chosenOption()"
        [options]="selectOptions"
        (valueChange)="chosenOption.set($event)"
      />
    </ibid-form-field>

    <ibid-form-field label="Date">
      <ibid-date-input [value]="chosenDate()" (valueChange)="chosenDate.set($event)" />
    </ibid-form-field>
  </div>
  <p class="showcase__state">
    Search: "{{ searchTerm() }}" · Quantity: {{ quantity() }} · Period: {{ chosenOption() }} ·
    Date: {{ chosenDate() }}
  </p>
</section>

<section class="showcase__section">
  <h2>Segmented control</h2>
  <ibid-segmented-control
    [options]="segments"
    [value]="segment()"
    (valueChange)="segment.set($event)"
  />
  <p class="showcase__state">Selected: {{ segment() }}</p>
</section>
